<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="x-icon" href="static/Sudoku_Icon.png">
    <title>Sudoku</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>

    <div id="sudoku_title"> 
        <h1>Sudoku</h1>
    </div>

    <div id="game_settings">

        <div id="difficulty_setting">
            <label id="difficulty_lable">Difficulty</label>

            <div class="dropdown">
                <button id="difficulty_dropdown_button">Easy</button>
                <div class="dropdown_options" id="difficulty_options">
                    <button onclick="set_difficulty('Easy')">Easy</button>
                    <button onclick="set_difficulty('Medium')">Medium</button>
                    <button onclick="set_difficulty('Hard')">Hard</button>
                </div>
            </div>
        </div>

        <div id="generate_game">
            <button onclick="newPuzzle()">Generate Puzzle</button>
        </div>

        <div id="autocheck">
            <label id="autocheck_lable">Autocheck</label>
            <button id="autocheck_on" class="autocheck_btn autocheck_btn_active" onclick="set_autocheck(1)">On</button>
            <button id="autocheck_off" class="autocheck_btn" onclick="set_autocheck(0)">Off</button>
        </div>
    </div>
    
    <div id="board_container">
        <div id="board">
            <div id="win_pop_up" class="close_pop_up">
                <div id="close_pop_up_btn">
                    <button onclick="close_pop_up(false)">x</button>
                </div>
                <div id="pop_up_text">
                    <h1>YOU WON!</h1>
                </div>
                <div id="pop_up_play_again_btn">
                    <button onclick="close_pop_up(true)">Play Again</button>
                </div>
            </div>
        </div>
        </div>
    </div>

    
    

    <script src="sudoku.js"></script>
</body>
</html>
